name: Build ESP32

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/cache
          key: ${{ runner.os }}-arduino-esp32-3.0.7-busio1145-${{ hashFiles('**/*.ino') }}
          restore-keys: |
            ${{ runner.os }}-arduino-esp32-3.0.7-busio1145-
            ${{ runner.os }}-arduino-

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Clean Old Libraries and Cache
        run: |
          rm -rf ~/Arduino/libraries
          rm -rf ~/.arduino15/cache
          echo "Libraries and cache cleared."

      - name: Install Libraries
        run: |
          # Display & graphics
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "JPEGDEC"

          # JSON
          arduino-cli lib install "ArduinoJson"

          # Adafruit sensor stack
          # BusIO 1.14.5 = versi terakhir yang TIDAK pakai typedef BitOrder
          arduino-cli lib install "Adafruit Unified Sensor@1.1.14"
          arduino-cli lib install "Adafruit BusIO@1.14.5"
          arduino-cli lib install "Adafruit MPU6050@2.2.6"

      - name: Verify Library Versions
        run: |
          echo "=== Installed Libraries ==="
          arduino-cli lib list
          echo ""
          echo "=== BusIO BitOrder check ==="
          grep -r "typedef BitOrder" ~/Arduino/libraries/Adafruit_BusIO/ \
            && echo "MASALAH: BitOrder typedef ditemukan!" \
            || echo "OK: BitOrder typedef tidak ada di BusIO ini"

      - name: Install esptool
        run: pip install esptool

      - name: Debug Board Info
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi \
            --build-property "build.extra_flags=-DBOARD_HAS_PSRAM" \
            --output-dir ./output \
            camera_test/camera_test.ino

      - name: List Output Files (debug)
        if: always()
        run: |
          echo "=== ./output contents ==="
          ls -lh ./output || echo "output folder tidak ada!"
          echo ""
          echo "=== All .bin files ==="
          find ./output -name "*.bin" 2>/dev/null || echo "Tidak ada .bin ditemukan"

      - name: Merge Binaries
        run: |
          BOOTLOADER=$(ls ./output/*.bootloader.bin 2>/dev/null | head -1)
          PARTITIONS=$(ls ./output/*.partitions.bin 2>/dev/null | head -1)
          BOOTAPP0=$(find ~/.arduino15/packages/esp32/hardware/esp32/3.0.7/tools/partitions/boot_app0.bin 2>/dev/null | head -1)
          APP=$(ls ./output/camera_test.ino.bin 2>/dev/null | head -1)

          echo "Bootloader : $BOOTLOADER"
          echo "Partitions : $PARTITIONS"
          echo "boot_app0  : $BOOTAPP0"
          echo "App        : $APP"

          # Validasi semua file ada sebelum merge
          for f in "$BOOTLOADER" "$PARTITIONS" "$BOOTAPP0" "$APP"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "ERROR: File tidak ditemukan: $f"
              exit 1
            fi
          done

          esptool.py --chip esp32s3 merge_bin \
            -o ./output/merged-firmware.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0000 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0xe000 "$BOOTAPP0" \
            0x10000 "$APP"

          echo ""
          echo "=== Merge result ==="
          ls -lh ./output/merged-firmware.bin

      - name: List Final Output
        if: always()
        run: |
          echo "=== Final output folder ==="
          ls -lh ./output/

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ github.sha }}
          path: |
            ./output/merged-firmware.bin
            ./output/*.bin
          retention-days: 30

      - name: Upload Partial Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-debug-${{ github.sha }}
          path: ./output/
          retention-days: 7
