name: Build ESP32
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/cache
          key: ${{ runner.os }}-arduino-esp32-2.0.17-v5-${{ hashFiles('**/*.ino') }}
          restore-keys: |
            ${{ runner.os }}-arduino-esp32-2.0.17-v5-
            ${{ runner.os }}-arduino-

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Clean Old Libraries and Cache
        run: |
          rm -rf ~/Arduino/libraries
          rm -rf ~/.arduino15/cache
          echo "Cleaned."

      - name: Install Libraries
        run: |
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit MPU6050"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Install esptool
        run: pip install esptool pyserial

      - name: Create output dir
        run: mkdir -p ./output

      - name: Debug FQBN options
        run: |
          echo "=== ESP32S3 PSRAM options ==="
          arduino-cli board details --fqbn esp32:esp32:esp32s3 | grep -A5 -i psram
          echo "=== All ESP32S3 options ==="
          arduino-cli board details --fqbn esp32:esp32:esp32s3

      - name: Compile Sketch
        run: echo "Lihat output Debug FQBN dulu sebelum compile"
