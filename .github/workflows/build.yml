name: Build ESP32

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/cache
          key: ${{ runner.os }}-arduino-esp32-3.0.7-v4-${{ hashFiles('**/*.ino') }}
          restore-keys: |
            ${{ runner.os }}-arduino-esp32-3.0.7-v4-
            ${{ runner.os }}-arduino-

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Clean Old Libraries and Cache
        run: |
          rm -rf ~/Arduino/libraries
          rm -rf ~/.arduino15/cache
          echo "Cleaned."

      - name: Install Libraries
        run: |
          # Display & graphics
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "TJpg_Decoder"
          arduino-cli lib install "JPEGDEC"

          # JSON
          arduino-cli lib install "ArduinoJson"

          # Adafruit Unified Sensor
          arduino-cli lib install "Adafruit Unified Sensor@1.1.14"

          # Install MPU6050 tanpa deps agar tidak pull BusIO versi lama
          arduino-cli lib install "Adafruit MPU6050@2.2.6" --no-deps

          # FIX: BusIO 1.16.1+ sudah punya guard untuk BitOrder
          # yang dihapus di ESP32 core 3.0.7
          arduino-cli lib install "Adafruit BusIO@1.16.1"

      - name: Verify BusIO Version
        run: |
          echo "=== Installed Libraries ==="
          arduino-cli lib list
          echo ""
          echo "=== BusIO version in use ==="
          cat ~/Arduino/libraries/Adafruit_BusIO/library.properties | grep version
          echo ""
          echo "=== BitOrder typedef check ==="
          grep -r "typedef BitOrder" ~/Arduino/libraries/Adafruit_BusIO/ \
            && echo "MASALAH: BitOrder typedef ditemukan — build akan gagal!" \
            || echo "OK: BitOrder typedef tidak ada — aman"

      - name: Install esptool
        run: pip install esptool

      - name: Debug Sketch Path
        run: |
          echo "=== Repo structure ==="
          find . -name "*.ino" | head -20
          echo ""
          echo "=== camera_test folder ==="
          ls -lh camera_test/ || echo "folder camera_test tidak ada!"

      - name: Debug Board Info
        run: arduino-cli board details -b esp32:esp32:esp32s3

      - name: Create output dir
        run: mkdir -p ./output

      - name: Compile Sketch
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi \
            --build-property "build.extra_flags=-DBOARD_HAS_PSRAM" \
            --output-dir ./output \
            --verbose \
            camera_test/camera_test.ino

      - name: List Output Files
        if: always()
        run: |
          echo "=== ./output contents ==="
          ls -lh ./output/ 2>/dev/null || echo "output folder kosong atau tidak ada"
          echo ""
          echo "=== All .bin files ==="
          find ./output -name "*.bin" 2>/dev/null || echo "Tidak ada .bin"

      - name: Merge Binaries
        run: |
          BOOTLOADER=$(ls ./output/*.bootloader.bin 2>/dev/null | head -1)
          PARTITIONS=$(ls ./output/*.partitions.bin 2>/dev/null | head -1)
          BOOTAPP0=$(find ~/.arduino15/packages/esp32/hardware/esp32/3.0.7/tools/partitions/ \
            -name "boot_app0.bin" 2>/dev/null | head -1)
          APP=$(ls ./output/camera_test.ino.bin 2>/dev/null | head -1)

          echo "Bootloader : $BOOTLOADER"
          echo "Partitions : $PARTITIONS"
          echo "boot_app0  : $BOOTAPP0"
          echo "App        : $APP"

          for f in "$BOOTLOADER" "$PARTITIONS" "$BOOTAPP0" "$APP"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "ERROR: File tidak ditemukan -> '$f'"
              exit 1
            fi
          done

          esptool.py --chip esp32s3 merge_bin \
            -o ./output/merged-firmware.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0000 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0xe000 "$BOOTAPP0" \
            0x10000 "$APP"

          echo "=== Merge result ==="
          ls -lh ./output/merged-firmware.bin

      - name: List Final Output
        if: always()
        run: |
          echo "=== Final output ==="
          ls -lh ./output/ 2>/dev/null || echo "output folder tidak ada"

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ github.sha }}
          path: |
            ./output/merged-firmware.bin
            ./output/*.bin
          retention-days: 30

      - name: Upload Debug on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-debug-${{ github.sha }}
          path: ./output/
          if-no-files-found: warn
          retention-days: 7
